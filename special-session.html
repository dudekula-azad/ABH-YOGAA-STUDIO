    <script>

        /* =====================================================
           GLOBAL VARIABLES
        ===================================================== */

        let specialSession =
            null;


        let currentCustomer =
            null;


        let bookingProcessing =
            false;


        /* =====================================================
           GET SESSION ID FROM URL
        ===================================================== */

        function getSpecialSessionId() {

            const params =
                new URLSearchParams(
                    window.location.search
                );


            return params.get(
                "id"
            );

        }


        /* =====================================================
           ESCAPE HTML
        ===================================================== */

        function escapeHTML(
            value
        ) {

            return String(
                value ?? ""
            )

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =====================================================
           FORMAT DATE
        ===================================================== */

        function formatDate(
            value
        ) {

            if (!value) {

                return "Special Day";

            }


            try {

                return new Date(
                    `${value}T00:00:00`
                ).toLocaleDateString(
                    "en-IN",
                    {
                        day:
                            "2-digit",

                        month:
                            "long",

                        year:
                            "numeric"
                    }
                );

            }

            catch (error) {

                return value;

            }

        }


        /* =====================================================
           FORMAT TIME
        ===================================================== */

        function formatTime(
            value
        ) {

            if (!value) {

                return "";

            }


            const parts =
                value.split(":");


            const hour =
                Number(
                    parts[0]
                );


            const minute =
                Number(
                    parts[1] || 0
                );


            const suffix =
                hour >= 12
                    ? "PM"
                    : "AM";


            const displayHour =
                hour % 12 || 12;


            return `${displayHour}:${
                String(
                    minute
                ).padStart(
                    2,
                    "0"
                )
            } ${suffix}`;

        }


        /* =====================================================
           SHOW STATUS
        ===================================================== */

        function showStatus(
            message,
            type
        ) {

            const element =
                document.getElementById(
                    "specialStatus"
                );


            if (!element) {

                return;

            }


            element.textContent =
                message;


            element.className =
                `special-status ${type}`;

        }


        /* =====================================================
           LOAD SPECIAL SESSION
        ===================================================== */

        async function loadSpecialSession() {

            const container =
                document.getElementById(
                    "specialSessionContainer"
                );


            const sessionId =
                getSpecialSessionId();


            if (!sessionId) {

                container.className =
                    "special-error";


                container.innerHTML = `

                    <h2>
                        Special Session Not Found
                    </h2>

                    <p>
                        No special session was selected.
                    </p>

                `;


                return;

            }


            try {

                const {
                    data,
                    error
                } = await window.supabaseClient

                    .from(
                        "special_sessions"
                    )

                    .select(`

                        id,
                        title,
                        description,
                        session_date,
                        start_time,
                        end_time,
                        image_url,
                        price,
                        capacity,
                        is_active

                    `)

                    .eq(
                        "id",
                        sessionId
                    )

                    .eq(
                        "is_active",
                        true
                    )

                    .maybeSingle();


                if (error) {

                    throw error;

                }


                if (!data) {

                    container.className =
                        "special-error";


                    container.innerHTML = `

                        <h2>
                            Special Session Not Available
                        </h2>

                        <p>
                            This session is no longer available.
                        </p>

                    `;


                    return;

                }


                specialSession =
                    data;


                await renderSpecialSession();

            }

            catch (error) {

                console.error(
                    "Special session loading error:",
                    error
                );


                container.className =
                    "special-error";


                container.innerHTML = `

                    <h2>
                        Unable to Load Session
                    </h2>

                    <p>
                        Please refresh and try again.
                    </p>

                `;

            }

        }


        /* =====================================================
           GET CURRENT CUSTOMER
        ===================================================== */

        async function getCurrentCustomer() {

            const {
                data: {
                    user
                },
                error: authError
            } = await window.supabaseClient
                .auth
                .getUser();


            if (
                authError ||
                !user
            ) {

                return null;

            }


            const {
                data: customer,
                error
            } = await window.supabaseClient

                .from(
                    "customers"
                )

                .select(`

                    id,
                    full_name,
                    phone,
                    email

                `)

                .eq(
                    "email",
                    user.email
                )

                .maybeSingle();


            if (error) {

                console.error(
                    "Customer loading error:",
                    error
                );


                return null;

            }


            return customer || null;

        }


        /* =====================================================
           GET BOOKED SEATS
           
           NOTE:
           This is only for display.
           The actual booking capacity is protected
           by the PostgreSQL RPC.
        ===================================================== */

        async function getBookedSeats() {

            /*
             * Customer RLS only allows customers to see
             * their own bookings.
             *
             * Therefore this function is only a best-effort
             * display count.
             *
             * The final capacity decision happens inside:
             *
             * create_special_session_booking()
             */

            const {
                count,
                error
            } = await window.supabaseClient

                .from(
                    "special_session_bookings"
                )

                .select(
                    "id",
                    {
                        count:
                            "exact",

                        head:
                            true
                    }
                )

                .eq(
                    "special_session_id",
                    specialSession.id
                )

                .in(
                    "booking_status",
                    [
                        "pending",
                        "confirmed"
                    ]
                );


            if (error) {

                console.warn(
                    "Seat display count unavailable:",
                    error
                );


                return 0;

            }


            return count || 0;

        }


        /* =====================================================
           RENDER SPECIAL SESSION
        ===================================================== */

        async function renderSpecialSession() {

            const container =
                document.getElementById(
                    "specialSessionContainer"
                );


            const bookedSeats =
                await getBookedSeats();


            const capacity =
                Number(
                    specialSession.capacity || 0
                );


            const remainingSeats =
                Math.max(
                    0,
                    capacity -
                    bookedSeats
                );


            const price =
                Number(
                    specialSession.price || 0
                );


            let imageHTML;


            if (
                specialSession.image_url
            ) {

                imageHTML = `

                    <img
                        src="${escapeHTML(
                            specialSession.image_url
                        )}"
                        alt="${escapeHTML(
                            specialSession.title ||
                            "Special Session"
                        )}"
                    >

                `;

            }

            else {

                imageHTML = `

                    <div
                        class="special-session-placeholder"
                    >
                        🧘
                    </div>

                `;

            }


            container.className =
                "";


            container.innerHTML = `

                <div
                    class="special-session-detail-card"
                >

                    <!-- =====================================
                         IMAGE
                    ====================================== -->

                    <div
                        class="special-session-hero"
                    >

                        ${imageHTML}

                    </div>


                    <!-- =====================================
                         CONTENT
                    ====================================== -->

                    <div
                        class="special-session-detail-content"
                    >

                        <span
                            class="special-session-badge"
                        >

                            Special Session

                        </span>


                        <h1>

                            ${escapeHTML(
                                specialSession.title ||
                                "Special Yoga Session"
                            )}

                        </h1>


                        <div
                            class="special-session-description"
                        >

                            ${escapeHTML(
                                specialSession.description ||
                                "Join us for a special yoga experience."
                            )}

                        </div>


                        <!-- =================================
                             INFORMATION
                        ================================== -->

                        <div
                            class="special-session-info-grid"
                        >

                            <div
                                class="special-session-info"
                            >

                                <i
                                    class="fa-solid fa-calendar-days"
                                ></i>

                                Date

                                <strong>

                                    ${formatDate(
                                        specialSession.session_date
                                    )}

                                </strong>

                            </div>


                            <div
                                class="special-session-info"
                            >

                                <i
                                    class="fa-regular fa-clock"
                                ></i>

                                Time

                                <strong>

                                    ${formatTime(
                                        specialSession.start_time
                                    )}

                                    ${
                                        specialSession.end_time

                                        ? " - " +
                                          formatTime(
                                              specialSession.end_time
                                          )

                                        : ""
                                    }

                                </strong>

                            </div>


                            <div
                                class="special-session-info"
                            >

                                <i
                                    class="fa-solid fa-users"
                                ></i>

                                Seats

                                <strong>

                                    ${
                                        capacity > 0

                                        ? `${remainingSeats} remaining`

                                        : "Limited Seats"
                                    }

                                </strong>

                            </div>


                            <div
                                class="special-session-info"
                            >

                                <i
                                    class="fa-solid fa-indian-rupee-sign"
                                ></i>

                                Price

                                <strong>

                                    ${
                                        price === 0

                                        ? "Free"

                                        : "₹" +
                                          price.toFixed(2)
                                    }

                                </strong>

                            </div>

                        </div>


                        <!-- =================================
                             BOOKING AREA
                        ================================== -->

                        ${
                            capacity > 0 &&
                            remainingSeats <= 0

                            ? `

                                <div
                                    class="special-login-message"
                                >

                                    This Special Session is
                                    currently fully booked.

                                </div>

                            `

                            : `

                                <div
                                    id="specialBookingArea"
                                    class="special-session-booking"
                                >

                                    <h2>
                                        Book This Special Session
                                    </h2>


                                    <div
                                        id="specialBookingContent"
                                    >

                                        Loading booking details...

                                    </div>

                                </div>

                            `
                        }

                    </div>

                </div>

            `;


            if (
                capacity <= 0 ||
                remainingSeats > 0
            ) {

                await loadBookingForm();

            }

        }


        /* =====================================================
           LOAD BOOKING FORM
        ===================================================== */

        async function loadBookingForm() {

            const area =
                document.getElementById(
                    "specialBookingContent"
                );


            if (!area) {

                return;

            }


            currentCustomer =
                await getCurrentCustomer();


            if (!currentCustomer) {

                area.innerHTML = `

                    <div
                        class="special-login-message"
                    >

                        Please

                        <a
                            href="customer-login.html"
                        >
                            login
                        </a>

                        as a customer before booking
                        this Special Session.

                    </div>

                `;


                return;

            }


            const price =
                Number(
                    specialSession.price || 0
                );


            area.innerHTML = `

                <form
                    id="specialBookingForm"
                >

                    <!-- =================================
                         NAME
                    ================================== -->

                    <div
                        class="special-booking-group"
                    >

                        <label>
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="specialCustomerName"

                                currentCustomer.full_name ||
                                ""
                            )}"
                            required
                        >

                    </div>


                    <!-- =================================
                         PHONE
                    ================================== -->

                    <div
                        class="special-booking-group"
                    >

                        <label>
                            Phone
                        </label>

                        <input
                            type="tel"

                                currentCustomer.phone ||

                            )}"
                            required
                        >

                    </div>


                    <!-- =================================

                    ================================== -->

                    <div

                    >

                        </label>

                        <input
                            type="email"
                            id="specialCustomerEmail"
                            value="${escapeHTML(
                                currentCustomer.email ||
                                ""
                            )}"
                            readonly
                        >

                    </div>


                    <!-- =================================
                         SUMMARY
                    ================================== -->

                    <div
                        class="special-booking-summary"
                    >

                        <div
                            class="special-booking-summary-row"
                        >

                            <span>
                                Session
                            </span>

                            <strong>

                                ${escapeHTML(
                                    specialSession.title
                                )}

                            </strong>

                        </div>


                        <div
                            class="special-booking-summary-row"
                        >

                            <span>
                                Date
                            </span>

                            <strong>

                                ${formatDate(
                                    specialSession.session_date
                                )}

                            </strong>

                        </div>


                        <div
                            class="special-booking-summary-row"
                        >

                            <span>
                                Time
                            </span>

                            <strong>

                                ${formatTime(
                                    specialSession.start_time
                                )}

                                ${
                                    specialSession.end_time

                                    ? " - " +
                                      formatTime(
                                          specialSession.end_time
                                      )

                                    : ""
                                }

                            </strong>

                        </div>


                        <div
                            class="special-booking-summary-row"
                        >

                            <span>
                                Amount
                            </span>

                            <strong>

                                ${
                                    price === 0

                                    ? "Free"

                                    : "₹" +

                            </strong>

                        </div>

                    </div>


                    <!-- =================================

                    ================================== -->

                    <button

                    <!-- =================================

                        id="specialStatus"

            document
                .getElementById(
                    "specialBookingForm"

                .addEventListener(

                    processSpecialBooking
                );

        }


        /* =====================================================
           PROCESS SPECIAL BOOKING
           
           IMPORTANT:
           Capacity is finally checked inside PostgreSQL RPC.
        ===================================================== */

async function processSpecialBooking(event) {

    event.preventDefault();

    if (bookingProcessing) {
        return;
    }

    bookingProcessing = true;

    const button =
        document.getElementById(
            "specialPayBtn"
        );

    if (button) {

        button.disabled = true;

        button.textContent =
            "Processing...";

    }

    try {

        // ========================================================
        // CHECK SUPABASE
        // ========================================================

        if (!window.supabaseClient) {

            throw new Error(
                "Supabase connection is not available."
            );

        }


        // ========================================================
        // CHECK RAZORPAY
        // ========================================================

        if (typeof Razorpay !== "function") {

            throw new Error(
                "Razorpay Checkout is not loaded."
            );

        }


        // ========================================================
        // AUTHENTICATION
        // ========================================================

        const {
            data: {
                user
            },
            error: authError
        } =
            await window.supabaseClient
                .auth
                .getUser();


        if (
            authError ||
            !user
        ) {

            throw new Error(
                "Please login before booking."
            );

        }


        // ========================================================
        // GET CUSTOMER
        // ========================================================

        currentCustomer =
            await getCurrentCustomer();


        if (!currentCustomer) {

            throw new Error(
                "Customer profile not found."
            );

        }


        // ========================================================
        // GET LATEST SPECIAL SESSION
        // ========================================================

        const {
            data: session,
            error: sessionError
        } =
            await window.supabaseClient
                .from(
                    "special_sessions"
                )
                .select(`
                    id,
                    title,
                    price,
                    capacity,
                    is_active
                `)
                .eq(
                    "id",
                    specialSession.id
                )
                .eq(
                    "is_active",
                    true
                )
                .maybeSingle();


        if (sessionError) {

            throw sessionError;

        }


        if (!session) {

            throw new Error(
                "This Special Session is no longer available."
            );

        }


        // ========================================================
        // PRICE
        //
        // Price is read from the database.
        // Browser amount is NOT trusted by the backend.
        // ========================================================

        const amount =
            Number(
                session.price || 0
            );


        if (
            !Number.isFinite(amount) ||
            amount <= 0
        ) {

            throw new Error(
                "Invalid Special Session price."
            );

        }


        // ========================================================
        // GET CURRENT AUTH SESSION
        // ========================================================

        const {
            data: {
                session: authSession
            }
        } =
            await window.supabaseClient
                .auth
                .getSession();


        if (!authSession) {

            throw new Error(
                "Your login session has expired. Please login again."
            );

        }


        // ========================================================
        // CREATE RAZORPAY ORDER
        //
        // IMPORTANT:
        // Use Supabase Functions SDK directly.
        // Do NOT use window.SUPABASE_URL.
        // ========================================================

        const {
            data: orderData,
            error: orderError
        } =
            await window.supabaseClient
                .functions
                .invoke(
                    "hyper-worker",
                    {
                        body: {

                            payment_type:
                                "special_session",

                            special_session_id:
                                session.id

                        }
                    }
                );


        // ========================================================
        // HANDLE ORDER ERROR
        // ========================================================

        if (orderError) {

            console.error(
                "Special session order error:",
                orderError
            );

            let errorMessage =
                "Unable to create payment order.";

            if (
                orderError.context
            ) {

                try {

                    const responseText =
                        await orderError
                            .context
                            .text();

                    if (responseText) {

                        try {

                            const parsed =
                                JSON.parse(
                                    responseText
                                );

                            if (
                                parsed &&
                                parsed.error
                            ) {

                                errorMessage =
                                    parsed.error;

                            }

                        }

                        catch (_) {

                            if (
                                responseText.trim()
                            ) {

                                errorMessage =
                                    responseText;

                            }

                        }

                    }

                }

                catch (_) {

                    // Keep default error message

                }

            }

            throw new Error(
                errorMessage
            );

        }


        // ========================================================
        // VALIDATE ORDER RESPONSE
        // ========================================================

        if (
            !orderData ||
            !orderData.success ||
            !orderData.order_id ||
            !orderData.payment_intent_id ||
            !orderData.amount ||
            !orderData.key_id
        ) {

            console.error(
                "Invalid order response:",
                orderData
            );

            throw new Error(
                "Invalid Razorpay order response."
            );

        }


        // ========================================================
        // RAZORPAY CHECKOUT OPTIONS
        // ========================================================

        const options = {

            key:
                orderData.key_id,

            amount:
                orderData.amount,

            currency:
                orderData.currency ||
                "INR",

            name:
                "ABH Yogaa Studio",

            description:
                session.title,

            order_id:
                orderData.order_id,

            prefill: {

                name:
                    currentCustomer.full_name ||
                    "",

                email:
                    currentCustomer.email ||
                    user.email ||
                    "",

                contact:
                    currentCustomer.phone ||
                    ""

            },

            theme: {

                color:
                    "#7b5e3b"

            },


            // ====================================================
            // PAYMENT SUCCESS
            // ====================================================

            handler:
                async function (
                    razorpayResponse
                ) {

                    try {

                        console.log(
                            "SPECIAL SESSION RAZORPAY RESPONSE:",
                            razorpayResponse
                        );


                        // =========================================
                        // VERIFY PAYMENT SERVER-SIDE
                        // =========================================

                        const {
                            data: verifyData,
                            error: verifyError
                        } =
                            await window.supabaseClient
                                .functions
                                .invoke(
                                    "hyper-responder",
                                    {
                                        body: {

                                            payment_intent_id:
                                                orderData
                                                    .payment_intent_id,

                                            razorpay_payment_id:
                                                razorpayResponse
                                                    .razorpay_payment_id,

                                            razorpay_signature:
                                                razorpayResponse
                                                    .razorpay_signature

                                        }
                                    }
                                );


                        if (verifyError) {

                            console.error(
                                "Payment verification error:",
                                verifyError
                            );

                            throw verifyError;

                        }


                        if (
                            !verifyData ||
                            !verifyData.success
                        ) {

                            throw new Error(
                                verifyData?.error ||
                                "Payment verification failed."
                            );

                        }


                        // =========================================
                        // GET FINALIZATION RESULT
                        // =========================================

                        const finalization =
                            verifyData.finalization ||
                            {};


                        const specialBookingId =
                            finalization
                                .special_session_booking_id;


                        if (!specialBookingId) {

                            throw new Error(
                                "Payment was verified, but the Special Session booking was not finalized."
                            );

                        }


                        // =========================================
                        // SHOW SUCCESS
                        // =========================================

                        const bookingArea =
                            document.getElementById(
                                "specialBookingArea"
                            );


                        if (bookingArea) {

                            bookingArea.innerHTML = `

                                <div
                                    class="booking-success"
                                >

                                    <div
                                        class="booking-success-icon"
                                    >
                                        ✓
                                    </div>


                                    <h2>
                                        Booking Confirmed!
                                    </h2>


                                    <p>
                                        Your Special Session has
                                        been booked successfully.
                                    </p>


                                    <div
                                        class="special-booking-summary"
                                    >

                                        <div
                                            class="special-booking-summary-row"
                                        >

                                            <span>
                                                Session
                                            </span>

                                            <strong>
                                                ${escapeHTML(
                                                    session.title
                                                )}
                                            </strong>

                                        </div>


                                        <div
                                            class="special-booking-summary-row"
                                        >

                                            <span>
                                                Payment
                                            </span>

                                            <strong>
                                                Paid
                                            </strong>

                                        </div>


                                        <div
                                            class="special-booking-summary-row"
                                        >

                                            <span>
                                                Booking ID
                                            </span>

                                            <strong>
                                                #${specialBookingId}
                                            </strong>

                                        </div>

                                    </div>

                                </div>

                            `;

                        }


                        console.log(
                            "SPECIAL SESSION BOOKING SUCCESS:",
                            finalization
                        );


                        bookingProcessing =
                            false;

                    }


                    catch (error) {

                        console.error(
                            "Special Session payment verification error:",
                            error
                        );


                        showStatus(
                            error.message ||
                            "Payment verification failed. Please contact support if money was deducted.",
                            "error"
                        );


                        if (button) {

                            button.disabled =
                                false;

                            button.textContent =
                                `Pay ₹${amount.toFixed(2)} & Confirm Booking`;

                        }


                        bookingProcessing =
                            false;

                    }

                },


            // ====================================================
            // CHECKOUT CLOSED
            // ====================================================

            modal: {

                ondismiss:
                    function () {

                        console.log(
                            "Special Session Razorpay checkout dismissed."
                        );


                        showStatus(
                            "Payment cancelled. You can try again.",
                            "error"
                        );


                        if (button) {

                            button.disabled =
                                false;

                            button.textContent =
                                `Pay ₹${amount.toFixed(2)} & Confirm Booking`;

                        }


                        bookingProcessing =
                            false;

                    }

            }

        };


        // ========================================================
        // OPEN RAZORPAY
        // ========================================================

        const razorpay =
            new Razorpay(
                options
            );


        // ========================================================
        // PAYMENT FAILURE
        // ========================================================

        razorpay.on(
            "payment.failed",
            function (
                response
            ) {

                console.error(
                    "Special Session payment failed:",
                    response
                );


                showStatus(
                    "Payment failed. No booking was confirmed. Please try again.",
                    "error"
                );


                if (button) {

                    button.disabled =
                        false;

                    button.textContent =
                        `Pay ₹${amount.toFixed(2)} & Confirm Booking`;

                }


                bookingProcessing =
                    false;

            }
        );


        // ========================================================
        // OPEN CHECKOUT
        // ========================================================

        razorpay.open();

    }


    catch (error) {

        console.error(
            "Special Session booking error:",
            error
        );


        showStatus(
            error.message ||
            "Unable to start payment. Please try again.",
            "error"
        );


        if (button) {

            button.disabled =
                false;

            button.textContent =
                `Pay ₹${Number(
                    specialSession?.price || 0
                ).toFixed(2)} & Confirm Booking`;

        }


        bookingProcessing =
            false;

    }

}


        /* =====================================================
           START PAGE
        ===================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                loadSpecialSession();

            }
        );

    </script>

</body>

</html>
