<body>


    <!-- ================= NAVBAR ================= -->

    <header>

        <nav class="navbar">

            <div class="logo"></div>

            <ul>

                <li>
                    <a href="index.html">

                    </a>

                </li>

                <li>
                    <a href="index.html#contact">

    <!-- ================= CHOOSE SERVICE ================= -->

    <section class="services service-selection">

        <div class="section-title">

            <h2>
                Choose Your Yoga
            </h2>

            <p>
                Select a yoga service to continue with your booking.
            </p>

        </div>


        <!-- DATABASE SERVICES -->

        <div
            class="service-list"
            id="serviceList">

            <div
                class="service-loading"
                style="
                    width:100%;
                    text-align:center;
                    padding:40px 20px;

            </div>

    <!-- ================= FOOTER ================= -->

    <footer class="footer">

            © 2026 ABH Yogaa Studio. All Rights Reserved.

        </div>

    </footer>


    <!-- ================= SUPABASE ================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase-config.js"></script>


    <!-- ================= DATABASE SERVICES ================= -->

    <script>

        /*
        ============================================================
        GET SELECTED PLAN
        ============================================================
        */

        const selectedPlan =
            new URLSearchParams(
                window.location.search
            ).get("plan");


        /*
        ============================================================
        ESCAPE HTML
        ============================================================
        */

        function escapeHtml(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /*
        ============================================================
        GET SERVICE ICON
        ============================================================
        */

        function getServiceIcon(service) {

            /*
            Use Font Awesome icon from DB if available.
            Otherwise use a safe default.
            */

            const icon =
                service.icon ||
                service.service_icon ||
                "fa-solid fa-spa";


            /*
            If the database contains a Font Awesome class,
            render it.
            */

            if (
                String(icon).includes("fa-")
            ) {

                return `
                    <i class="${escapeHtml(icon)}"></i>
                `;

            }


            /*
            Fallback for old emoji/text icon values.
            */

            return escapeHtml(icon);

        }


        /*
        ============================================================
        BUILD SERVICE URL
        ============================================================
        */

        function buildServiceUrl(
            service
        ) {

            const slug =
                encodeURIComponent(
                    service.slug
                );


            let url =
                "service.html?slug=" +
                slug;


            /*
            Preserve One Day / One Month /
            Three Months selection.
            */

            if (selectedPlan) {

                url +=
                    "&plan=" +
                    encodeURIComponent(
                        selectedPlan
                    );

            }


            return url;

        }


        /*
        ============================================================
        LOAD SERVICES
        ============================================================
        */

        async function loadServices() {

            const serviceList =
                document.getElementById(
                    "serviceList"
                );


            if (!serviceList) {

                return;

            }


            const db =
                window.supabaseClient;


            if (!db) {

                serviceList.innerHTML = `

                    <div
                        class="service-loading"
                        style="
                            width:100%;
                            text-align:center;
                            padding:40px 20px;
                        ">

                        Unable to connect
                        to the service database.

                    </div>

                `;

                return;

            }


            try {

                const {
                    data: services,
                    error
                } = await db

                    .from("services")

                    .select(`
                        id,
                        name,
                        slug,
                        short_description,
                        description,
                        image_url,
                        is_active,
                        is_coming_soon,
                        display_order
                    `)

                    .eq(
                        "is_active",
                        true
                    )

                    .order(
                        "display_order",
                        {
                            ascending: true
                        }
                    );


                if (error) {

                    console.error(
                        "Services loading error:",
                        error
                    );

                    serviceList.innerHTML = `

                        <div
                            class="service-loading"
                            style="
                                width:100%;
                                text-align:center;
                                padding:40px 20px;
                            ">

                            Unable to load services.

                        </div>

                    `;

                    return;

                }


                const activeServices =
                    (services || [])
                        .filter(
                            service =>
                                service.is_active !== false
                        );


                /*
                ====================================================
                NO SERVICES
                ====================================================
                */

                if (
                    activeServices.length === 0
                ) {

                    serviceList.innerHTML = `

                        <div
                            class="service-loading"
                            style="
                                width:100%;
                                text-align:center;
                                padding:40px 20px;
                            ">

                            No services are
                            currently available.

                        </div>

                    `;

                    return;

                }


                /*
                ====================================================
                RENDER SERVICES
                ====================================================
                */

                serviceList.innerHTML =
                    activeServices
                        .map(
                            service => {

                                const name =
                                    service.name ||
                                    "Yoga Service";


                                const description =
                                    service.short_description ||
                                    service.description ||
                                    "Explore this yoga service.";


                                const serviceUrl =
                                    buildServiceUrl(
                                        service
                                    );


                                /*
                                Coming Soon services
                                remain visible but are
                                not clickable.
                                */

                                if (
                                    service.is_coming_soon
                                ) {

                                    return `

                                        <div
                                            class="service-item coming-soon">

                                            <div>

                                                <h3>

                                                    ${getServiceIcon(service)}

                                                    ${escapeHtml(name)}

                                                </h3>

                                                <p>

                                                    Coming Soon

                                                </p>

                                            </div>

                                            <span
                                                class="coming-soon-text">

                                                Coming Soon

                                            </span>

                                        </div>

                                    `;

                                }


                                return `

                                    <a
                                        href="${serviceUrl}"
                                        class="service-item">

                                        <div>

                                            <h3>

                                                ${getServiceIcon(service)}

                                                ${escapeHtml(name)}

                                            </h3>

                                            <p>

                                                ${escapeHtml(description)}

                                            </p>

                                        </div>

                                        <span>

                                            →

                                        </span>

                                    </a>

                                `;

                            }
                        )
                        .join("");


            }

            catch (error) {

                console.error(
                    "Unexpected services error:",
                    error
                );


                serviceList.innerHTML = `

                    <div
                        class="service-loading"
                        style="
                            width:100%;
                            text-align:center;
                            padding:40px 20px;
                        ">

                        Something went wrong
                        while loading services.

                    </div>

                `;

            }

        }


        /*
        ============================================================
        START
        ============================================================
        */

        document.addEventListener(
            "DOMContentLoaded",
            loadServices
        );

    </script>


</body>
